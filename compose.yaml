services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development password in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    image: boro-biya/api:phase1
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      SERVICE_NAME: api
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command:
      ['sh', '-c', 'node apps/api/dist/db/cli.js migrate && exec node apps/api/dist/index.js']
    ports:
      - '127.0.0.1:${API_PUBLISHED_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  relation:
    image: boro-biya/relation:phase1
    build:
      context: .
      dockerfile: services/relation/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SERVICE_NAME: relation
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:${RELATION_PUBLISHED_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  sos:
    image: boro-biya/sos:phase1
    build:
      context: .
      dockerfile: services/sos/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SERVICE_NAME: sos
      API_HOST: 0.0.0.0
      API_PORT: '3002'
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:${SOS_PUBLISHED_PORT:-3002}:3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    image: boro-biya/web:phase1
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: '4173'
    ports:
      - '127.0.0.1:${WEB_PUBLISHED_PORT:-5173}:4173'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
