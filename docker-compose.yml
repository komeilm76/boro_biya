# Docker Compose is the single source of truth for service versions in development and
# integration environments (OPS-66). Application services are built from the repository with
# pinned base images; the database service is built from the pinned vendor image
# (postgres:18.6, docker/db.Dockerfile) with Debian security updates applied at build time
# (SEC-63). Production deployment stays declarative (OPS-71) and is documented in
# docs/operations/README.md.
#
# Quick start (docs/development/01-development-environment.md §4):
#   bun install && bun run env:create
#   docker compose up --build          # web, api, relation, sos, db (+ one-shot migrate)
#
# Single replica per service by design (ADR-008); metrics ports are deliberately NOT published —
# the metrics interface stays non-public (OPS-63). Resource limits are declared per container
# (OPS-52) and overridable for the host at hand (OPS-87).
name: boro-biya

services:
  db:
    # PostgreSQL 18 (OPS-05); minor pinned — the exact version (postgres:18.6) is declared in
    # docker/db.Dockerfile, a one-layer wrapper that applies published Debian security updates
    # at build time (SEC-63) with the pgdg repository removed so the PostgreSQL pin can never
    # drift (QA-47). Evidence and rationale: docs/REFERENCES.md.
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: boro-biya/db:dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boro_biya}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (bun run env:create)}"
      POSTGRES_DB: ${POSTGRES_DB:-boro_biya}
      # Fail closed on weak dev defaults: the password comes from the local .env, never from a
      # value baked into this file (OPS-70).
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory of /var/lib/postgresql
      # (PGDATA=/var/lib/postgresql/18/docker) and its entrypoint refuses the legacy
      # /data mount point; the volume follows the image's documented layout (OPS-05).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boro_biya} -d ${POSTGRES_DB:-boro_biya}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.0}"
          memory: ${DB_MEMORY_LIMIT:-1024M}

  # One-shot migration job (OPS-20, OPS-81 runbook): creates the service roles, schemas, and
  # applies every service's migrations with the administrative connection, then exits.
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_MAIN: apps/api/dist/main.js
    image: boro-biya/api:dev
    command: ["node", "packages/db/dist/cli.js", "init-cluster"]
    environment:
      NODE_ENV: production
      DB_ADMIN_URL: postgres://${POSTGRES_USER:-boro_biya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boro_biya}
      CORE_DB_PASSWORD: "${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in .env (bun run env:create)}"
      RELATION_DB_PASSWORD: "${RELATION_DB_PASSWORD:?set RELATION_DB_PASSWORD in .env (bun run env:create)}"
      SOS_DB_PASSWORD: "${SOS_DB_PASSWORD:?set SOS_DB_PASSWORD in .env (bun run env:create)}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: boro-biya/api:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_MAIN: apps/api/dist/main.js
    command: ["node", "apps/api/dist/main.js"]
    environment: &backend-env
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # Metrics bind inside the container; the port is not published, so the metrics interface
      # stays non-public (OPS-63).
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgres://boro_core:${CORE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-boro_biya}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-2000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-10}
      BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: ${API_MEMORY_LIMIT:-512M}

  relation:
    image: boro-biya/relation:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_MAIN: services/relation/dist/main.js
    command: ["node", "services/relation/dist/main.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: relation
      API_PORT: "3001"
      METRICS_PORT: "9001"
      DATABASE_URL: postgres://boro_relation:${RELATION_DB_PASSWORD}@db:5432/${POSTGRES_DB:-boro_biya}
      # WEB_ORIGIN is core-API-only configuration; services do not serve browsers directly.
      WEB_ORIGIN: ""
    ports:
      - "${RELATION_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${RELATION_CPU_LIMIT:-1.0}"
          memory: ${RELATION_MEMORY_LIMIT:-512M}

  sos:
    image: boro-biya/sos:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE_MAIN: services/sos/dist/main.js
    command: ["node", "services/sos/dist/main.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: sos
      API_PORT: "3002"
      METRICS_PORT: "9002"
      DATABASE_URL: postgres://boro_sos:${SOS_DB_PASSWORD}@db:5432/${POSTGRES_DB:-boro_biya}
      WEB_ORIGIN: ""
    ports:
      - "${SOS_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${SOS_CPU_LIMIT:-1.0}"
          memory: ${SOS_MEMORY_LIMIT:-512M}

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: boro-biya/web:dev
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
      # Fixed proxy upstream: browser-facing code uses relative /api paths and this server
      # forwards them (OPS-64; SSRF closed by construction — the target is not user input).
      API_ORIGIN: http://api:3000
      BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-0.5}"
          memory: ${WEB_MEMORY_LIMIT:-128M}

volumes:
  db-data:
